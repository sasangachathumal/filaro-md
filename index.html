<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filaro</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="app">
      <div class="layout">
        <aside class="sidebar" aria-label="Files">
          <div id="sidebar-root" class="sidebar-content"></div>
          <footer id="resource-root" class="sidebar-footer" aria-label="Resource usage"></footer>
        </aside>

        <div class="main">
          <header class="toolbar">
            <button id="open-file-button" type="button">Open Markdown File…</button>
            <span id="status" class="status" role="status"></span>
          </header>

          <main id="preview-root" class="preview" aria-live="polite">
            <p class="empty-state">Open a markdown file to preview it here.</p>
          </main>
        </div>
      </div>
    </div>
  </body>
</html>
